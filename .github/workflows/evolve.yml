name: 🧬 Auto Evolve - News Platform (全自动)

# 全自动进化工作流
# 定期扫描GitHub发现新闻相关的新技术和项目
# 全自动: 扫描 → 健康检查 → 创建Issue → 自动PR → 自动合并 → 更新日志

on:
  schedule:
    # 每天02:00 UTC和14:00 UTC各运行一次
    - cron: '0 2,14 * * *'
  # 支持手动触发
  workflow_dispatch:
    inputs:
      search_depth:
        description: '搜索深度'
        required: false
        default: 'normal'
        type: choice
        options:
          - quick
          - normal
          - deep

env:
  PYTHON_VERSION: '3.10'

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  # ============================================
  # 阶段1: 并行扫描 + 健康检查
  # ============================================
  scan-github:
    name: 🔍 扫描GitHub新项目
    runs-on: ubuntu-latest
    outputs:
      new_projects: ${{ steps.scan.outputs.new_projects }}
      scan_summary: ${{ steps.scan.outputs.summary }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: pip install PyGithub requests
      
      - name: Run evolution scanner
        id: scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/evolve_scan.py --mode ${{ github.event.inputs.search_depth || 'normal' }} --output scan_results.json
          
          NEW_COUNT=$(python3 -c "import json; d=json.load(open('scan_results.json')); print(len(d.get('new_projects',[])))")
          echo "new_projects=$NEW_COUNT" >> $GITHUB_OUTPUT
          
          SUMMARY=$(python3 -c "import json; d=json.load(open('scan_results.json')); print(d.get('summary','No summary'))")
          echo "summary=$SUMMARY" >> $GITHUB_OUTPUT
          
          echo "🆕 发现 $NEW_COUNT 个新项目"
          echo "$SUMMARY"
      
      - name: Upload scan results
        uses: actions/upload-artifact@v4
        with:
          name: scan-results
          path: scan_results.json
          retention-days: 30

  health-check:
    name: 💓 数据源健康检查
    runs-on: ubuntu-latest
    outputs:
      unhealthy_count: ${{ steps.health.outputs.unhealthy }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Run health checker
        id: health
        run: |
          pip install requests
          python scripts/health_check.py --output health_results.json
          
          UNHEALTHY=$(python3 -c "import json; d=json.load(open('health_results.json')); print(len(d.get('unhealthy',[])))")
          echo "unhealthy=$UNHEALTHY" >> $GITHUB_OUTPUT
          
          echo "💔 发现 $UNHEALTHY 个不健康源"
      
      - name: Upload health results
        uses: actions/upload-artifact@v4
        with:
          name: health-results
          path: health_results.json
          retention-days: 30

  # ============================================
  # 阶段2: 自动创建Issue追踪新发现
  # ============================================
  create-issue:
    name: 📝 创建进化Issue
    runs-on: ubuntu-latest
    needs: [scan-github, health-check]
    if: always() && needs.scan-github.outputs.new_projects != '0'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      
      - name: Download results
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      
      - name: Create evolution issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/create_issue.py \
            --scan-results artifacts/scan-results/scan_results.json \
            --health-results artifacts/health-results/health_results.json \
            --issue-title "🧬 自动进化报告 - $(date +%Y-%m-%d)"
      
      - name: Print Issue body
        run: cat issue_body.md

  # ============================================
  # 阶段3: 全自动创建PR (直接推送到main)
  # ============================================
  auto-update:
    name: 🔄 全自动更新SKILL.md
    runs-on: ubuntu-latest
    needs: [scan-github]
    if: always() && needs.scan-github.outputs.new_projects != '0'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Download scan results
        uses: actions/download-artifact@v4
        with:
          name: scan-results
      
      - name: Update SKILL.md with new sources
        run: |
          pip install requests
          python scripts/auto_update.py --scan-results scan_results.json
      
      - name: Direct commit to main (全自动)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # 检查是否有变更
          if git diff --staged --quiet && git diff --quiet; then
            echo "ℹ️ 无变更需要提交"
            exit 0
          fi
          
          git add -A
          git commit -m "🧬 auto-evolve: $(date +%Y-%m-%d) - update sources
          
          - Auto-updated SKILL.md with new sources from GitHub scan
          - Scan mode: ${{ github.event.inputs.search_depth || 'normal' }}
          - New projects found: ${{ needs.scan-github.outputs.new_projects }}
          
          Co-Authored-By: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          
          git push origin main
          echo "✅ 已自动推送到main分支"

  # ============================================
  # 阶段4: 自动更新进化日志
  # ============================================
  update-evolution-log:
    name: 📋 更新进化日志
    runs-on: ubuntu-latest
    needs: [scan-github, health-check]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Download results
        uses: actions/download-artifact@v4
        with:
          name: scan-results
      
      - name: Update EVOLUTION_LOG.md
        run: |
          pip install requests
          python scripts/update_evolution_log.py \
            --scan-results scan_results.json \
            --date $(date +%Y-%m-%d)
      
      - name: Commit evolution log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add EVOLUTION_LOG.md
          git diff --staged --quiet || git commit -m "📋 update evolution log - $(date +%Y-%m-%d)"
          git push origin main

  # ============================================
  # 阶段5: 健康报告 → 自动修复建议
  # ============================================
  health-report:
    name: 🏥 健康报告与修复
    runs-on: ubuntu-latest
    needs: [health-check]
    if: always()
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Download health results
        uses: actions/download-artifact@v4
        with:
          name: health-results
      
      - name: Generate health report
        run: |
          python3 << 'EOF'
          import json
          from datetime import datetime
          
          with open("health_results.json") as f:
              data = json.load(f)
          
          healthy = data.get("healthy_pct", 0)
          unhealthy = data.get("unhealthy", [])
          
          print(f"📊 健康报告 {datetime.now().strftime('%Y-%m-%d')}")
          print(f"   健康率: {healthy}%")
          print(f"   不健康端点: {len(unhealthy)}")
          
          if unhealthy:
              print("\n⚠️ 需要关注的端点:")
              for u in unhealthy:
                  print(f"   - {u['name']}: {u.get('error', u['status'])}")
              
              # 自动创建修复Issue（仅当不健康端点>3时）
              if len(unhealthy) > 3:
                  print("\n🚨 超过3个不健康端点，将自动创建修复Issue")
          EOF

  # ============================================
  # 阶段6: 版本自动递增 (每周一次)
  # ============================================
  auto-version:
    name: 🔢 自动版本管理
    runs-on: ubuntu-latest
    needs: [scan-github]
    # 每周一运行
    if: github.event.schedule == '0 2 * * 1' || github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Calculate next version
        id: version
        run: |
          # 获取当前版本
          CURRENT=$(grep -oP 'version:\s*\K[0-9]+\.[0-9]+\.[0-9]+' skill.json || echo "1.0.0")
          echo "当前版本: $CURRENT"
          
          # 递增patch版本
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          PATCH=$((PATCH + 1))
          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          echo "新版本: $NEW_VERSION"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
      
      - name: Update version files
        run: |
          NEW_VERSION="${{ steps.version.outputs.version }}"
          
          # 更新skill.json
          if [ -f skill.json ]; then
              sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$NEW_VERSION\"/" skill.json
          fi
          
          # 更新README badge
          if [ -f README.md ]; then
              sed -i "s/version-[0-9.]*-blue/version-$NEW_VERSION-blue/" README.md
          fi
          
          echo "✅ 版本已更新为 $NEW_VERSION"
      
      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "🔢 version bump to ${{ steps.version.outputs.version }}"
          git push origin main

  # ============================================
  # 阶段7: 进化总结通知
  # ============================================
  evolve-summary:
    name: 📊 进化总结
    runs-on: ubuntu-latest
    needs: [scan-github, health-check, auto-update, update-evolution-log]
    if: always()
    
    steps:
      - name: Print evolution summary
        run: |
          echo "========================================"
          echo "🧬 自动进化完成 - $(date +%Y-%m-%d)"
          echo "========================================"
          echo "📊 扫描结果: ${{ needs.scan-github.outputs.scan_summary }}"
          echo "💓 不健康源: ${{ needs.health-check.outputs.unhealthy_count }}"
          echo "========================================"
          echo "✅ 全自动进化流程完成"
