name: 🧬 Auto Evolve - News Platform

# 自动进化工作流
# 定期扫描GitHub发现新闻相关的新技术和项目
# 自动创建Issue追踪新发现，可选自动创建PR更新

on:
  schedule:
    # 每天02:00 UTC运行
    - cron: '0 2 * * *'
  # 也支持手动触发
  workflow_dispatch:
    inputs:
      search_depth:
        description: '搜索深度 (quick/normal/deep)'
        required: false
        default: 'normal'
        type: choice
        options:
          - quick
          - normal
          - deep
      auto_pr:
        description: '自动创建PR'
        required: false
        default: false
        type: boolean

env:
  PYTHON_VERSION: '3.10'

jobs:
  # 任务1: 扫描GitHub发现新项目
  scan-github:
    name: 🔍 扫描GitHub新项目
    runs-on: ubuntu-latest
    outputs:
      new_projects: ${{ steps.scan.outputs.new_projects }}
      scan_summary: ${{ steps.scan.outputs.summary }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          pip install PyGithub requests
      
      - name: Run evolution scanner
        id: scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/evolve_scan.py --mode ${{ github.event.inputs.search_depth || 'normal' }} --output scan_results.json
          
          # 设置输出
          NEW_COUNT=$(python3 -c "import json; d=json.load(open('scan_results.json')); print(len(d.get('new_projects',[])))")
          echo "new_projects=$NEW_COUNT" >> $GITHUB_OUTPUT
          
          SUMMARY=$(python3 -c "import json; d=json.load(open('scan_results.json')); print(d.get('summary','No summary'))")
          echo "summary=$SUMMARY" >> $GITHUB_OUTPUT
          
          echo "发现 $NEW_COUNT 个新项目"
          echo "$SUMMARY"
      
      - name: Upload scan results
        uses: actions/upload-artifact@v4
        with:
          name: scan-results
          path: scan_results.json
          retention-days: 30

  # 任务2: 分析现有源的健康状况
  health-check:
    name: 💓 数据源健康检查
    runs-on: ubuntu-latest
    outputs:
      unhealthy_count: ${{ steps.health.outputs.unhealthy }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Run health checker
        id: health
        run: |
          python scripts/health_check.py --output health_results.json
          
          UNHEALTHY=$(python3 -c "import json; d=json.load(open('health_results.json')); print(len(d.get('unhealthy',[])))")
          echo "unhealthy=$UNHEALTHY" >> $GITHUB_OUTPUT
          
          echo "发现 $UNHEALTHY 个不健康源"
      
      - name: Upload health results
        uses: actions/upload-artifact@v4
        with:
          name: health-results
          path: health_results.json
          retention-days: 30

  # 任务3: 创建Issue追踪新发现
  create-issue:
    name: 📝 创建进化Issue
    runs-on: ubuntu-latest
    needs: [scan-github, health-check]
    if: needs.scan-github.outputs.new_projects != '0'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Download scan results
        uses: actions/download-artifact@v4
        with:
          name: scan-results
      
      - name: Download health results
        uses: actions/download-artifact@v4
        with:
          name: health-results
      
      - name: Create evolution issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/create_issue.py \
            --scan-results scan_results.json \
            --health-results health_results.json \
            --issue-title "🧬 自动进化报告 - $(date +%Y-%m-%d)"

  # 任务4: 可选 - 自动创建PR更新SKILL.md
  auto-update:
    name: 🔄 自动更新SKILL.md
    runs-on: ubuntu-latest
    needs: [scan-github]
    if: github.event.inputs.auto_pr == 'true' && needs.scan-github.outputs.new_projects != '0'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Download scan results
        uses: actions/download-artifact@v4
        with:
          name: scan-results
      
      - name: Update SKILL.md with new sources
        run: |
          python scripts/auto_update.py --scan-results scan_results.json
      
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: '🧬 auto-evolve: add new sources from GitHub scan'
          title: '🧬 Auto Evolve: New Sources Discovered'
          body: |
            ## 🤖 自动进化报告
            
            本次扫描发现新项目，已自动更新 SKILL.md。
            
            ### 变更内容
            - 新增数据源（详见 diff）
            - 更新采集引擎配置
            
            ### 审核清单
            - [ ] 新源是否真正可用？
            - [ ] 是否需要API Key？
            - [ ] 是否符合免费策略？
            - [ ] 是否与现有源重复？
            
            > 此 PR 由 GitHub Actions 自动创建。请人工审核后合并。
          branch: auto-evolve/${{ github.run_number }}
          delete-branch: true
          labels: |
            auto-evolve
            automated pr

  # 任务5: 更新进化日志
  update-changelog:
    name: 📋 更新进化日志
    runs-on: ubuntu-latest
    needs: [scan-github, health-check]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Download results
        uses: actions/download-artifact@v4
        with:
          name: scan-results
      
      - name: Update EVOLUTION_LOG.md
        run: |
          python scripts/update_evolution_log.py \
            --scan-results scan_results.json \
            --date $(date +%Y-%m-%d)
      
      - name: Commit evolution log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add EVOLUTION_LOG.md
          git diff --staged --quiet || git commit -m "📋 update evolution log - $(date +%Y-%m-%d)"
          git push
